name: build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart:
    name: Dart analysis
    runs-on: ubuntu-22.04
    env:
      MISE_ENABLE_TOOLS: http:flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout Dart dependency submodule
        run: git submodule update --init external/party_relay

      - name: Install project toolchain
        uses: jdx/mise-action@v5
        with:
          cache_key_prefix: mise-v0-${{ env.MISE_ENABLE_TOOLS }}

      - name: Resolve dependencies
        run: mise exec -- flutter pub get

      - name: Analyze Dart application
        run: mise exec -- flutter analyze --no-pub lib
