name: build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout build submodules
        run: git submodule update --init external/language external/party_relay

      - name: Install project toolchain
        uses: jdx/mise-action@v5

      - name: Resolve dependencies
        run: mise exec -- flutter pub get

      - name: Build debug APK
        run: mise exec -- flutter build apk --debug
